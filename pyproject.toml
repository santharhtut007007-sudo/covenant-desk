[project]
name = "covenant-desk"
version = "0.1.0"
description = "Agentic monitoring of financial covenants in leveraged credit agreements"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "scipy>=1.18.1",
]

[project.scripts]
covenant-desk = "covenant_desk.cli:main"
covenant-desk-risk = "covenant_desk.report:main"
covenant-desk-eval = "covenant_desk.evaluate:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real SEC EDGAR API (deselect with -m 'not live')"]

[tool.ruff]
line-length = 100
